; ClockHub firmware for the Waveshare ESP32-S3-Touch-AMOLED-1.75
; Build:      pio run
; Flash app:  pio run -t upload
; Flash web UI + faces (LittleFS):  pio run -t uploadfs

[env:clockhub]
extra_scripts = pre:tools/stamp_build.py
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; TinyUSB serial: open the port at 1200 baud to reboot into the ROM bootloader,
; then flash on whichever port the bootloader appears as
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0          ; TinyUSB: serial + SD card as a USB drive
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    lvgl/lvgl @ 9.6.0
    moononournation/GFX Library for Arduino @ 1.6.8
    https://github.com/lewisxhe/SensorLib.git#v0.5.0
    lewisxhe/XPowersLib @ 0.3.3
    bblanchon/ArduinoJson @ 7.4.3
    ; ESP32-audioI2S 3.4.7 is vendored in lib/ with a watchdog fix (see lib/ESP32-audioI2S/CLOCKHUB.md)
